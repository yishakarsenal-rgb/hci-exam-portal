<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCI Study Portal — Notes &amp; 240-Question Exam</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Human-Computer Interaction (HCI) Exam Portal</h1>
      <p>
        60 questions per chapter (20 Multiple Choice, 20 True/False, 20 Fill in
        the Blank) + Study Notes
      </p>
    </header>

    <div class="container">
      <!-- Chapter Navigation -->
      <div class="tabs" id="chapterTabs"></div>

      <!-- Mode Switcher -->
      <div class="mode-bar">
        <button
          class="mode-btn active"
          id="btnNotesMode"
          onclick="setMode('notes')"
        >
          Study Notes
        </button>
        <button class="mode-btn" id="btnQuizMode" onclick="setMode('quiz')">
          Chapter Quiz (60 Questions)
        </button>
      </div>

      <!-- Study Notes Section -->
      <div id="notesSection"></div>

      <!-- Quiz Section -->
      <div id="quizSection" style="display: none">
        <div class="score-banner" id="scoreBanner">
          <div>
            <h2 id="bannerHeading">Chapter Score: 0/60 (0%)</h2>
            <p id="bannerSubtext"></p>
          </div>
          <button class="btn" id="nextChapterBtn" onclick="goToNextChapter()">
            Next Chapter &rarr;
          </button>
        </div>

        <form
          id="quizForm"
          onsubmit="
            event.preventDefault();
            gradeCurrentChapter();
          "
        >
          <div id="questionsContainer"></div>

          <div class="actions">
            <button type="submit" class="btn">
              Submit &amp; Grade Chapter
            </button>
            <button type="button" class="btn" onclick="resetCurrentChapter()">
              Reset Chapter
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
